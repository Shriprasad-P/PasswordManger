<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DPM</title>
    <style>
      body { margin: 0; padding: 12px; width: 360px; font-family: sans-serif; background: #f4f6fb; color: #1f2937; }
      .panel { background: #fff; border: 1px solid #dbe3f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
      .hidden { display: none; }
      .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .header-actions { display: flex; align-items: center; gap: 6px; }
      .identity { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
      .avatar { width: 30px; height: 30px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
      .id-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sync-indicator { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; color: #166534; background: #dcfce7; border: 1px solid #bbf7d0; border-radius: 999px; padding: 2px 6px; white-space: nowrap; }
      .sync-dot { width: 5px; height: 5px; border-radius: 50%; background: #16a34a; display: inline-block; }
      input, select, button { width: 100%; border-radius: 8px; border: 1px solid #cfd8e6; padding: 8px; font-size: 13px; margin-top: 5px; box-sizing: border-box; }
      select { background: #fff; }
      button { cursor: pointer; background: #2563eb; color: #fff; border: none; font-weight: 600; }
      button.secondary { background: #e5e7eb; color: #1f2937; }
      #credentials { display: grid; gap: 8px; }
      .cred { border: 1px solid #dbe3f0; border-radius: 8px; padding: 8px; background: #f9fbff; }
      .cred strong { display: block; font-size: 13px; }
      .cred span { display: block; font-size: 12px; color: #4b5563; }
      .cred-actions { display: flex; gap: 5px; margin-top: 5px; }
      .cred-action-btn { font-size: 10px; padding: 4px 8px; background: #fff; border: 1px solid #d1d5db; color: #374151; width: auto; border-radius: 6px; }
      .cred-action-btn:hover { background: #f9fafb; }
      .search-wrap { margin-top: 8px; position: relative; }
      .search-input { padding-left: 28px; }
      .search-icon { position: absolute; left: 8px; top: 12px; font-size: 12px; }
      .cred-meta { margin-top: 4px; font-size: 11px; color: #64748b; }
      .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-top: 6px; }
      .badge-secure { background: #dcfce7; color: #166534; }
      .badge-weak { background: #fef3c7; color: #854d0e; }
      .badge-reused { background: #fee2e2; color: #991b1b; }
      .empty-state { font-size: 12px; color: #6b7280; padding: 10px 2px; }
    </style>
  </head>
  <body>
    <h3>Decentralized Passwords</h3>
    <div id="onboardingPanel" class="panel hidden">
      <input id="onboardingName" placeholder="Name" />
      <input id="onboardingEmail" placeholder="Email" />
      <input id="onboardingMasterPassword" type="password" placeholder="Master Password" />
      <button id="onboardingSaveBtn">Create Vault</button>
    </div>
    <div id="lockedPanel" class="panel hidden">
      <input id="lockedMasterPassword" type="password" placeholder="Master Password" />
      <button id="unlockBtn">Unlock</button>
    </div>
    <div id="dashboardPanel" class="hidden">
      <div class="panel header-row">
        <div class="identity"><div class="avatar">👤</div><div class="id-text"><strong id="headerName"></strong><br/><span id="headerEmail"></span></div></div>
        <div class="header-actions">
          <span class="sync-indicator"><span class="sync-dot"></span>P2P</span>
          <button id="lockBtn" class="secondary" style="width:auto; padding: 4px 8px; font-size: 11px;">Lock</button>
        </div>
      </div>
      <div class="panel">
        <strong>Credentials</strong>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input id="credentialSearch" class="search-input" placeholder="Search site or username" />
        </div>
        <div id="credentials" style="margin-top: 10px"></div>
      </div>
      <div class="panel">
        <strong>Add New</strong>
        <input id="site" placeholder="Site (example.com)" />
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <select id="category">
          <option value="Work">Work</option>
          <option value="Personal" selected>Personal</option>
          <option value="Social">Social</option>
          <option value="Finance">Finance</option>
        </select>
        <button id="addBtn">Add</button>
      </div>
    </div>
    <div id="status" style="font-size:11px;color:#dc2626;text-align:center;margin-top:5px;"></div>
    <script src="popup.js"></script>
  </body>
</html>
